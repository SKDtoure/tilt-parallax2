<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilt Parallax</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #151515; overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* The stage matches your image's aspect ratio (set by script). */
  .stage {
    --ar: 1;
    position: relative;
    width: min(100vw, calc(100dvh * var(--ar)));
    aspect-ratio: var(--ar);
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .layer {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    object-fit: fill;
    will-change: transform;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .ui {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  button#enable {
    pointer-events: auto;
    font: 600 15px/1 inherit; font-family: inherit;
    padding: 12px 20px; border-radius: 999px; border: 0;
    background: #f2f2f2; color: #151515; cursor: pointer;
  }
  button#enable:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .hint {
    font-size: 13px; color: #fff; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s ease;
  }
  .hidden { display: none !important; }
  .fade { opacity: 0; }

  /* ---- Shake popup ---- */
  .popup {
    position: fixed; z-index: 10;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(80vw, 320px);
    box-sizing: border-box;
    padding: 22px 22px 20px;
    border-radius: 18px;
    background: rgba(24, 24, 24, .88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    color: #fff; text-align: center;
  }
  .popup:not(.hidden) { animation: pop .38s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop {
    from { opacity: 0; transform: translate(-50%, -46%) scale(.88); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .popup-kicker { margin: 0 0 4px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #9aa0a6; }
  .popup h2 { margin: 0 0 16px; font-size: 22px; line-height: 1.2; }
  .popup a.go {
    display: inline-block; padding: 12px 20px; border-radius: 999px;
    background: #f2f2f2; color: #151515; font-weight: 600; font-size: 15px;
    text-decoration: none;
  }
  .popup a.go:focus-visible, .popup-close:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .popup-close {
    position: absolute; top: 6px; right: 6px;
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: transparent; color: #cfcfcf; font-size: 26px; line-height: 1; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    .popup:not(.hidden) { animation: none; }
  }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Layered artwork that shifts as you tilt your phone or move your mouse. Tap to sway the foliage.">
  <div class="ui">
    <button id="enable" class="hidden" type="button">Tap to enable tilt</button>
    <div id="hint" class="hint hidden"></div>
  </div>
</main>

<div id="popup" class="popup hidden" role="dialog" aria-labelledby="popup-title">
  <button id="popup-close" class="popup-close" type="button" aria-label="Close">&times;</button>
  <p class="popup-kicker">You shook it loose</p>
  <h2 id="popup-title">Tokyo Dope City</h2>
  <a id="popup-link" class="go" href="https://tokyodopecity.com/" target="_blank" rel="noopener noreferrer">Visit tokyodopecity.com ↗</a>
</div>

<script>
/* ============ EDIT THESE ============ */

// List layers from BACK to FRONT. depth: 0 = barely moves, 1 = moves the most.
// sway: true = this layer sways when the screen is tapped.
const LAYERS = [
  { src: "layer1-back.png",   depth: 0.20 },
  { src: "layer1_5-back.png", depth: 0.35, spin: true },   // spin: true = rotates on long press
  { src: "layer2-far.png",    depth: 0.50, title: true },
  { src: "layer3-mid.png",    depth: 0.75, sway: true },
  { src: "layer4-front-plain.png", depth: 1.00 },          // sits underneath, always visible
  { src: "layer4-front.png",  depth: 1.00, pulse: true }   // pulse: true = fades in and out over the plain one
];

const MAX_SHIFT = 0.03;  // how far the front layer can move, as a fraction of image width (0.02 = subtle, 0.05 = strong)
const TILT_RANGE = 20;   // degrees of tilt needed to reach full movement (lower = more sensitive)
const SMOOTHING = 0.08;  // 0.04 = floaty, 0.15 = snappy
const DIRECTION = 1;     // set to -1 if the movement feels backwards

// Foliage sway (tap)
const SWAY_ANGLE = 1.4;        // max rotation in degrees (0.8 = very subtle, 3 = big)
const SWAY_SKEW = 1.0;         // extra bend in degrees, makes it feel less stiff
const SWAY_DURATION = 2600;    // milliseconds until it settles
const SWAY_CYCLES = 2.5;       // number of back-and-forth swings
const SWAY_ORIGIN = "50% 100%"; // pivot point of the sway ("50% 100%" = bottom center)

// Shake popup
const POPUP_URL = "https://tokyodopecity.com/";
const SHAKE_THRESHOLD = 25;    // how hard each jolt must be (lower = easier to trigger)
const SHAKE_HITS = 4;          // jolts needed...
const SHAKE_WINDOW = 900;      // ...within this many milliseconds
const SHAKE_COOLDOWN = 2500;   // ms before it can trigger again

// Title effect: a light glint that melts into a color split as you tilt further.
// Ranges are "how far you've tilted", from 0 (neutral) to 1 (full tilt).
const TITLE_FX = {
  glintIn:  [0.05, 0.25],  // glint fades in over this range
  glintOut: [0.40, 0.80],  // glint fades out over this range
  splitIn:  [0.40, 1.00],  // color split grows over this range
  glintBrightness: 2.6,    // how much the glint brightens the letters (1.5 = soft, 3.5 = blazing)
  glintWidth: 0.10,        // width of the glint band, as a fraction of the image width
  splitMax: 0.012,         // biggest color-split offset, as a fraction of the image width
  colorA: "rgba(255, 40, 80, 0.9)",   // ghost on the side you tilt toward
  colorB: "rgba(40, 220, 255, 0.9)"   // ghost on the opposite side
};

// Spinning circle (press and hold anywhere on the image)
const SPIN_CENTER = { x: 0.5, y: 0.5 }; // center of the circle in layer1_5-back.png, as a fraction of the image (0 to 1)
const LONG_PRESS_MS = 450;   // how long to hold before it starts spinning
const SPIN_SPEED = 220;      // degrees per second at full speed
const SPIN_RAMP = 0.05;      // how quickly it speeds up (higher = snappier)
const SPIN_FRICTION = 0.98;  // how it slows after you let go (closer to 1 = longer glide)

// Backlight pulse (layer4-front.png fading over layer4-front-plain.png at random)
const PULSE_MIN = 120;       // shortest wait before the light changes, in ms
const PULSE_MAX = 900;       // longest wait, in ms
const PULSE_DIM = 0;         // how dim the "off" state is (0 = fully plain, 0.3 = never fully off)
const PULSE_SMOOTH = 0.2;    // 0.05 = slow glow, 1 = hard flicker

// Shake sound (plays from "start" to "end", in seconds)
const SHAKE_SOUND = { src: "WE GOT BEETS.mp3", start: 3, end: 5, volume: 1 };

/* ============ CODE ============ */

const stage = document.getElementById("stage");
const enableBtn = document.getElementById("enable");
const hint = document.getElementById("hint");
const popup = document.getElementById("popup");
const popupClose = document.getElementById("popup-close");
const popupLink = document.getElementById("popup-link");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (range, v) => {
  const t = clamp((v - range[0]) / (range[1] - range[0]), 0, 1);
  return t * t * (3 - 2 * t);
};

popupLink.href = POPUP_URL;

// Build the layers
const layers = LAYERS.map((cfg, i) => {
  const img = new Image();
  img.className = "layer";
  img.alt = "";
  img.draggable = false;
  img.src = cfg.src;
  if (cfg.sway) img.style.transformOrigin = SWAY_ORIGIN;
  stage.insertBefore(img, stage.querySelector(".ui"));

  // Title layer gets a second, brightened copy on top, revealed through a moving band (the glint)
  let glint = null;
  if (cfg.title) {
    glint = new Image();
    glint.className = "layer";
    glint.alt = "";
    glint.draggable = false;
    glint.src = cfg.src;
    glint.style.opacity = "0";
    glint.style.filter = "brightness(" + TITLE_FX.glintBrightness + ")";
    const half = TITLE_FX.glintWidth / 3 / 2 * 100; // band is drawn on a mask 3x the layer width
    const band = "linear-gradient(100deg, transparent " + (50 - half) + "%, #000 50%, transparent " + (50 + half) + "%)";
    glint.style.webkitMaskImage = band;
    glint.style.maskImage = band;
    glint.style.webkitMaskRepeat = "no-repeat";
    glint.style.maskRepeat = "no-repeat";
    stage.insertBefore(glint, stage.querySelector(".ui"));
  }

  return { el: img, depth: cfg.depth, shift: 0, w: 0, sway: !!cfg.sway, title: !!cfg.title, glint: glint, spin: !!cfg.spin, pulse: !!cfg.pulse };
});

// Match stage to the image's aspect ratio
function setAspect() {
  const first = layers[0].el;
  if (first.naturalWidth) stage.style.setProperty("--ar", first.naturalWidth / first.naturalHeight);
  sizeLayers();
}
layers[0].el.addEventListener("load", setAspect);
if (layers[0].el.complete) setAspect();

// Each layer is enlarged by exactly the distance it can travel, so no edges ever show.
function sizeLayers() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  layers.forEach(l => {
    l.shift = l.depth * MAX_SHIFT * w;
    const pad = l.shift;
    l.w = w + pad * 2;
    if (l.spin) {
      // pivot on the circle's own center so it spins in place
      l.el.style.transformOrigin = (pad + SPIN_CENTER.x * w) + "px " + (pad + SPIN_CENTER.y * h) + "px";
    }
    [l.el, l.glint].forEach(el => {
      if (!el) return;
      el.style.left = -pad + "px";
      el.style.top = -pad + "px";
      el.style.width = l.w + "px";
      el.style.height = (h + pad * 2) + "px";
    });
    if (l.glint) {
      const size = (l.w * 3) + "px 100%";
      l.glint.style.webkitMaskSize = size;
      l.glint.style.maskSize = size;
    }
  });
}
new ResizeObserver(sizeLayers).observe(stage);

// Movement state: target (tx, ty) and smoothed current (cx, cy), both in -1..1
let tx = 0, ty = 0, cx = 0, cy = 0;

// Sway state
let swayStart = null;
let swayDir = 1;

// Spin state (long press)
let spinning = false;
let spinVel = 0;     // degrees per second
let spinAngle = 0;

// Backlight pulse state
let pulseTarget = 1, pulseCur = 1, pulseNext = 0;

let lastT = 0;

function triggerSway() {
  if (reduceMotion) return;
  swayStart = performance.now();
  swayDir = Math.random() < 0.5 ? -1 : 1; // lean a different way each tap
}

function frame(now) {
  const dt = lastT ? Math.min(50, now - lastT) : 16.67;
  lastT = now;
  const f = dt / 16.67; // 1 at 60fps, so motion feels the same on any screen
  cx += (tx - cx) * SMOOTHING;
  cy += (ty - cy) * SMOOTHING;

  // Sway: a quick start, then a swing that fades out smoothly
  let swayTransform = "";
  if (swayStart !== null) {
    const t = (now - swayStart) / SWAY_DURATION;
    if (t >= 1) {
      swayStart = null;
    } else {
      const env = (1 - t) * (1 - t) * Math.min(1, t * 10);
      const osc = Math.sin(t * SWAY_CYCLES * Math.PI * 2) * env * swayDir;
      swayTransform = " rotate(" + (osc * SWAY_ANGLE) + "deg) skewX(" + (osc * SWAY_SKEW) + "deg)";
    }
  }

  // Spin: ramps up while you hold, then glides to a stop after you let go
  if (spinning) spinVel += (SPIN_SPEED - spinVel) * (1 - Math.pow(1 - SPIN_RAMP, f));
  else spinVel *= Math.pow(SPIN_FRICTION, f);
  if (spinVel < 0.05) spinVel = 0;
  spinAngle = (spinAngle + spinVel * dt / 1000) % 360;

  // Backlight pulse: at random moments, pick lit or plain and ease toward it
  if (now >= pulseNext) {
    pulseTarget = Math.random() < 0.5 ? 1 : PULSE_DIM;
    pulseNext = now + PULSE_MIN + Math.random() * (PULSE_MAX - PULSE_MIN);
  }
  pulseCur += (pulseTarget - pulseCur) * (1 - Math.pow(1 - PULSE_SMOOTH, f));

  // Title effect amounts: glint rises and falls, color split takes over as tilt grows
  const mag = Math.min(1, Math.hypot(cx, cy));
  const glintAmt = smooth(TITLE_FX.glintIn, mag) * (1 - smooth(TITLE_FX.glintOut, mag));
  const splitAmt = smooth(TITLE_FX.splitIn, mag);

  for (const l of layers) {
    const t =
      "translate3d(" + (-cx * l.shift * DIRECTION) + "px," + (-cy * l.shift * DIRECTION) + "px,0)" +
      (l.sway ? swayTransform : "") +
      (l.spin ? " rotate(" + spinAngle + "deg)" : "");
    l.el.style.transform = t;
    if (l.pulse) l.el.style.opacity = pulseCur;

    if (l.title) {
      const g = l.glint;
      g.style.transform = t;
      g.style.opacity = glintAmt;

      // The glint band sweeps across the letters as you tilt left / right
      const pos = ((0.5 + cx * 0.6) - 1.5) * l.w + "px 0px";
      g.style.webkitMaskPosition = pos;
      g.style.maskPosition = pos;

      // Color split: two tinted ghosts slide out from behind the title in opposite directions
      const k = splitAmt * TITLE_FX.splitMax * l.w;
      if (k > 0.05) {
        const ox = (cx * k).toFixed(2), oy = (cy * k).toFixed(2);
        l.el.style.filter =
          "drop-shadow(" + ox + "px " + oy + "px 0 " + TITLE_FX.colorA + ") " +
          "drop-shadow(" + (-ox) + "px " + (-oy) + "px 0 " + TITLE_FX.colorB + ")";
      } else {
        l.el.style.filter = "none";
      }
    }
  }
  requestAnimationFrame(frame);
}
if (!reduceMotion) requestAnimationFrame(frame);

// ---- Mouse / pen (desktop fallback) ----
stage.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || reduceMotion) return;
  const r = stage.getBoundingClientRect();
  tx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
  ty = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
});
stage.addEventListener("pointerleave", e => {
  if (e.pointerType !== "touch") { tx = 0; ty = 0; }
});

// ---- Phone tilt ----
let base = null;      // the "neutral" holding angle, captured from the first reading
let gotSensor = false;

function onOrientation(e) {
  if (e.gamma == null || e.beta == null || reduceMotion) return;
  gotSensor = true;
  if (!base) base = { g: e.gamma, b: e.beta };
  tx = clamp((e.gamma - base.g) / TILT_RANGE, -1, 1);  // left / right
  ty = clamp((e.beta - base.b) / TILT_RANGE, -1, 1);   // toward / away
}

// ---- Shake detection ----
let lastAccel = null;
let shakeHits = [];
let lastShake = 0;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null || a.y == null || a.z == null) return;
  if (lastAccel) {
    const jolt = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
    if (jolt > SHAKE_THRESHOLD) {
      const now = Date.now();
      shakeHits.push(now);
      shakeHits = shakeHits.filter(t => now - t < SHAKE_WINDOW);
      if (shakeHits.length >= SHAKE_HITS && now - lastShake > SHAKE_COOLDOWN) {
        lastShake = now;
        shakeHits = [];
        onShake();
      }
    }
  }
  lastAccel = { x: a.x, y: a.y, z: a.z };
}

function startTilt() {
  window.addEventListener("deviceorientation", onOrientation);
  window.addEventListener("devicemotion", onMotion);
  enableBtn.classList.add("hidden");
  showHint("Tilt your phone. Tap to sway the leaves. Hold to spin. Shake for a surprise.", 5000);
  // If nothing arrives, this device has no motion sensor.
  setTimeout(() => {
    if (!gotSensor) showHint("No motion sensor found. Move your mouse over the image.", 4000);
  }, 1500);
}

function showHint(text, ms) {
  hint.textContent = text;
  hint.classList.remove("hidden", "fade");
  clearTimeout(showHint.t);
  showHint.t = setTimeout(() => {
    hint.classList.add("fade");
    setTimeout(() => hint.classList.add("hidden"), 700);
  }, ms);
}

// ---- Shake sound ----
const SOUND_URL = encodeURI(SHAKE_SOUND.src);
let audioCtx = null, audioBuf = null;
let fallbackAudio = null, fallbackReady = false, fallbackTimer = null;
let soundBusyUntil = 0;

// Browsers only allow sound after a touch or click, so the first one quietly gets it ready.
function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audioCtx && !fallbackAudio) {
    if (AC && location.protocol !== "file:") {
      // Preferred: decode once, then play the exact 3s to 5s slice
      audioCtx = new AC();
      fetch(SOUND_URL)
        .then(r => r.arrayBuffer())
        .then(buf => new Promise((ok, fail) => audioCtx.decodeAudioData(buf, ok, fail)))
        .then(decoded => { audioBuf = decoded; })
        .catch(() => {});
    } else {
      // Fallback (for example when the page is opened straight from a file)
      fallbackAudio = new Audio(SOUND_URL);
      fallbackAudio.preload = "auto";
    }
  }
  if (audioCtx && audioCtx.state !== "running") audioCtx.resume();
  if (fallbackAudio && !fallbackReady) {
    fallbackAudio.muted = true;
    const p = fallbackAudio.play();
    if (p) p.then(() => {
      fallbackAudio.pause();
      fallbackAudio.muted = false;
      fallbackReady = true;
    }).catch(() => { fallbackAudio.muted = false; });
  }
}
["pointerup", "touchend", "click", "keydown"].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { passive: true })
);

function playShakeSound() {
  const now = performance.now();
  const dur = SHAKE_SOUND.end - SHAKE_SOUND.start;
  if (now < soundBusyUntil) return;
  if (audioCtx && audioBuf) {
    soundBusyUntil = now + dur * 1000;
    const t0 = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    src.buffer = audioBuf;
    // tiny fade at the end so the cut doesn't click
    gain.gain.setValueAtTime(SHAKE_SOUND.volume, t0);
    gain.gain.setValueAtTime(SHAKE_SOUND.volume, t0 + Math.max(0, dur - 0.08));
    gain.gain.linearRampToValueAtTime(0, t0 + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(t0, SHAKE_SOUND.start, dur);
  } else if (fallbackAudio) {
    soundBusyUntil = now + dur * 1000;
    clearInterval(fallbackTimer);
    fallbackAudio.volume = SHAKE_SOUND.volume;
    fallbackAudio.currentTime = SHAKE_SOUND.start;
    fallbackAudio.play().catch(() => {});
    fallbackTimer = setInterval(() => {
      if (fallbackAudio.currentTime >= SHAKE_SOUND.end) {
        fallbackAudio.pause();
        clearInterval(fallbackTimer);
      }
    }, 40);
  }
}

// A shake opens the popup and plays the sound together
function onShake() {
  openPopup();
  playShakeSound();
}

// ---- Popup ----
function openPopup() {
  if (!popup.classList.contains("hidden")) return;
  popup.classList.remove("hidden");
  popupLink.focus({ preventScroll: true });
  if (navigator.vibrate) navigator.vibrate(40);
}
function closePopup() {
  popup.classList.add("hidden");
}
popupClose.addEventListener("click", closePopup);
popupLink.addEventListener("click", () => setTimeout(closePopup, 150));
window.addEventListener("keydown", e => {
  if (e.key === "Escape") closePopup();
  if ((e.key === "s" || e.key === "S") && !e.metaKey && !e.ctrlKey) onShake(); // desktop test shortcut
});

// ---- Tap: sway the foliage. Double-tap: reset tilt. Press and hold: spin the circle ----
let lastTap = 0;
let holdTimer = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  triggerSway();
  const now = Date.now();
  if (e.pointerType === "touch" && now - lastTap < 300) {
    base = null;
    showHint("Tilt reset to your current angle.", 1800);
  }
  lastTap = now;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (!reduceMotion) spinning = true; }, LONG_PRESS_MS);
});
function endHold() {
  clearTimeout(holdTimer);
  spinning = false;
}
window.addEventListener("pointerup", endHold);
window.addEventListener("pointercancel", endHold);
// Stop the long-press menu from popping up on phones
stage.addEventListener("contextmenu", e => e.preventDefault());

const needsPermission =
  typeof DeviceOrientationEvent !== "undefined" &&
  typeof DeviceOrientationEvent.requestPermission === "function";

const isTouch = matchMedia("(pointer: coarse)").matches;

if (needsPermission) {
  // iPhone / iPad: must be triggered by a tap
  enableBtn.classList.remove("hidden");
  enableBtn.addEventListener("click", async () => {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result === "granted") {
        // Shake uses the motion sensor; on iOS this is normally granted together with orientation.
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
          try { await DeviceMotionEvent.requestPermission(); } catch (_) {}
        }
        startTilt();
      } else {
        enableBtn.classList.add("hidden");
        showHint("Motion access was denied. Reload the page to try again.", 5000);
      }
    } catch (err) {
      showHint("Couldn’t enable tilt on this page.", 4000);
    }
  });
} else if (isTouch && "DeviceOrientationEvent" in window) {
  // Android and most others: no permission prompt needed
  startTilt();
} else {
  showHint("Move your mouse over the image. Click to sway the leaves, hold to spin.", 4500);
}
</script>
</body>
</html>
